name: Desktop release

on:
  push:
    tags: ["v*"]
  # Manual rehearsals create workflow artifacts only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tag must match a stable package version
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Release tag must equal v followed by the stable package.json version");
            }
          '
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  draft:
    name: Prepare one draft
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create or reuse the tag's draft
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, "");
            const version = tag.slice(1);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release =>
              release.tag_name === tag || release.tag_name === version);
            if (matches.length > 1) throw new Error(`Multiple releases match ${tag}; resolve them before uploading.`);
            if (matches.length === 1) {
              if (!matches[0].draft) throw new Error(`${tag} is already published; refusing to modify it.`);
              core.info(`Reusing draft ${matches[0].id} for ${tag}`);
              return;
            }
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: version, draft: true,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  package:
    name: Package Windows x64
    needs: [quality, draft]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: x64
      - run: npm ci
      - name: Prepare portable ManimGX runtime
        shell: pwsh
        run: ./scripts/setup-manimgx.ps1 -BuildPython (Get-Command python).Source
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Build unsigned Windows installer and update metadata
        run: npx electron-builder --win --x64 --publish never
      - name: Initialize packaged providers offline
        run: |
          node scripts/smoke-provider-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone
          node scripts/smoke-provider-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime "dist/win-unpacked/Learning Studio.exe"
      - name: Exercise packaged demo runtime
        run: node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime "dist/win-unpacked/Learning Studio.exe" --browser
      - name: Verify packaged ManimGX import and attribution
        shell: pwsh
        run: |
          & './dist/win-unpacked/resources/manimgx-runtime/python.exe' -I -c "import manimgx; print('Packaged ManimGX ready')"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ManimGX import failed' }
          foreach ($required in @('licenses/LearnHarness-AGPL-3.0.txt', 'licenses/pi-compaction.md')) {
            if (!(Test-Path -LiteralPath (Join-Path 'dist/win-unpacked/resources' $required))) { throw "Missing attribution: $required" }
          }
      - name: Archive the exact source revision with licenses
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $archive = "dist/Learning-Studio-$version-source.zip"
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $archive))
          try {
            foreach ($required in @('LICENSE', 'docs/learning-studio.md', 'docs/compaction-accounting.md', 'runtime/manimgx-requirements.txt', 'scripts/setup-manimgx.ps1')) {
              if ($null -eq $zip.GetEntry($required)) { throw "Missing source attribution or runtime recipe: $required" }
            }
            if ($zip.Entries.FullName -match '^(data|work|\.runtime|node_modules|dist)/|(^|/)(\.env[^/]*|auth\.json|[^/]*credentials[^/]*)$') { throw 'Private or generated files entered the source archive' }
          } finally { $zip.Dispose() }
      - name: Verify installer manifest against actual bytes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import yaml from 'js-yaml';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const info = yaml.load(fs.readFileSync('dist/latest.yml', 'utf8'));
          const name = `Learning-Studio-${version}-x64-setup.exe`;
          const bytes = fs.readFileSync(`dist/${name}`);
          const digest = crypto.createHash('sha512').update(bytes).digest('base64');
          if (info.version !== version || info.files?.length !== 1 || info.files[0].url !== name ||
              info.files[0].size !== bytes.length || info.files[0].sha512 !== digest || info.path !== name || info.sha512 !== digest) {
            throw new Error('Installer metadata does not match the built payload');
          }
          for (const file of [`${name}.blockmap`, `Learning-Studio-${version}-source.zip`]) {
            if (fs.statSync(`dist/${file}`).size <= 0) throw new Error(`Empty artifact: ${file}`);
          }
          NODE
      - name: Upload verified assets to the draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # The draft job refuses published releases; check again immediately before upload.
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/Learning-Studio-$version-x64-setup.exe" \
            "dist/Learning-Studio-$version-x64-setup.exe.blockmap" \
            dist/latest.yml "dist/Learning-Studio-$version-source.zip"
      - name: Save installers, source and update metadata
        uses: actions/upload-artifact@v7
        with:
          name: learning-studio-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Learning-Studio-*-x64-setup.exe
            dist/Learning-Studio-*-x64-setup.exe.blockmap
            dist/Learning-Studio-*-source.zip
            dist/latest.yml

  verify:
    name: Verify draft release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Drafts need write-scoped visibility, but this job only uses GET requests.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: List every release, drafts included
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Select the tag's single draft
        run: npx tsx scripts/verify-release.ts select "$RUNNER_TEMP/releases.json" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/draft.json"
      - name: Download the Windows update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata"
          id=$(DRAFT="$RUNNER_TEMP/draft.json" node -e '
            const fs = require("node:fs");
            const draft = JSON.parse(fs.readFileSync(process.env.DRAFT, "utf8"));
            const asset = draft.assets.find(entry => entry.name === "latest.yml");
            if (asset == null) throw new Error("draft has no latest.yml");
            console.log(asset.id);
          ')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/metadata/latest.yml"
      - name: Verify draft assets and update feed
        run: npx tsx scripts/verify-release.ts verify "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/metadata" --tag "$GITHUB_REF_NAME"
